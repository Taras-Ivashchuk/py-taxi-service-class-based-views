{% extends "base.html" %}

{% block content %}
  <h1>Manufacturer </h1>
  <p><strong>Name: </strong>{{ manufacturer.name }}</p>
  <p><strong>Country: </strong>{{ manufacturer.country }}</p>
  <div class="ml-3">
    <h3>cars</h3>
    {% for car in manufacturer.cars.all %}
      <ul>
        <hr>
        <p class="text-muted">model: {{ car.model }}</p>
      </ul>
    {% endfor %}
  </div>
{% endblock %}
